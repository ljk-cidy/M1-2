<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 데이터 기반 AI 비서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar"><h1>내 학습 데이터 AI 비서</h1><button id="darkModeToggle" type="button">다크 모드</button></header>
  <p id="status" role="status" aria-live="polite">서버 연결 중… 첫 요청은 서버 시작으로 지연될 수 있습니다.</p>
  <div class="container">
    <!-- 사이드바: 대화 기록 -->
    <aside class="sidebar">
      <h2>대화 목록</h2>
      <button id="newChatBtn">+ 새 대화 시작</button>
      <ul id="conversationList"></ul>
    </aside>

    <!-- 메인 대시보드 및 채팅 영역 -->
    <main class="main-content">
      <!-- 상단 요약 카드 -->
      <section class="summary-section">
        <h2>📊 데이터 요약 정보</h2>
        <div id="summaryCards" class="cards-grid">
          <div class="card"><span>기간</span><strong id="summaryPeriod">-</strong></div>
          <div class="card"><span>총 데이터</span><strong id="summaryCount">-</strong></div>
          <div class="card"><span>평균 / 최고</span><strong id="summaryStats">-</strong></div>
          <div class="card"><span>트렌드</span><strong id="summaryTrend">-</strong></div>
        </div>
      </section>

      <section class="visualization-section"><h2>학습 시간 추세</h2><button id="exportCsvBtn" type="button">CSV 내보내기</button><svg id="timeSeriesChart" viewBox="0 0 800 220" role="img" aria-label="날짜별 학습 시간 그래프"></svg></section>
      <!-- AI 채팅 영역 -->
      <section class="chat-section">
        <div id="chatMessages" class="messages-container"></div>
        <div id="loadingIndicator" class="loading hidden">AI가 답변을 생성하고 있습니다...</div>
        <form id="chatForm" class="chat-form">
          <input type="text" id="chatInput" aria-label="질문" maxlength="4000" placeholder="내 데이터에 대해 궁금한 점을 물어보세요..." required />
          <button type="submit">전송</button>
        </form>
      </section>

      <!-- 하단 데이터 관리 영역 (CRUD) -->
      <section class="data-management">
        <h2>📝 시계열 데이터 관리</h2>
        <form id="addDataForm" class="data-form">
          <input type="date" id="inputDate" aria-label="날짜" required />
          <input type="number" step="0.1" id="inputValue" aria-label="학습 시간" placeholder="값 (예: 4.5)" required />
          <input type="text" id="inputMemo" aria-label="메모" maxlength="1000" placeholder="메모" required />
          <button type="submit">데이터 추가</button>
        </form>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>날짜</th><th>값</th><th>메모</th><th>작동</th></tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
